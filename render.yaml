# Render Blueprint for the live backend (free plan). GROQ_API_KEY is entered once in the
# Render dashboard (sync: false) and is never stored in this repository.
services:
  - type: web
    name: patient-journey-assistant-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["src/pjassist/**", "space/app.py", "render/**", "data/corpus/**", "data/cache/passages_emb.npy", "results/dev/selection.json"]
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_DAILY_CAP
        value: "120"
