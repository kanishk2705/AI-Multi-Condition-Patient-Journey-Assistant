name: Python tests

on:
  push:
    branches: [main, phase-1-project-spec]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m patient_journey_assistant.ingest --manifest data/source_manifest.csv
      - run: pytest
