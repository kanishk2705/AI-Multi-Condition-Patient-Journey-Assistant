name: Phase 6 answer quality and safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/patient_journey_assistant/answer_generation.py"
      - "src/patient_journey_assistant/safety.py"
      - "src/patient_journey_assistant/evaluate_answers.py"
      - "src/patient_journey_assistant/evaluate_safety.py"
      - "src/patient_journey_assistant/evaluate_extractive.py"
      - "data/benchmark/**"
      - "data/source_manifest.csv"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/phase6-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "src/patient_journey_assistant/answer_generation.py"
      - "src/patient_journey_assistant/safety.py"
      - "src/patient_journey_assistant/evaluate_answers.py"
      - "src/patient_journey_assistant/evaluate_safety.py"
      - "src/patient_journey_assistant/evaluate_extractive.py"
      - "data/benchmark/**"
      - "data/source_manifest.csv"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/phase6-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-answer-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  answer-quality:
    name: Test, check safety preflight, and optionally score answers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install -r requirements-dev.txt

      - name: Validate source manifest without fetching
        run: python -m patient_journey_assistant.ingest --manifest data/source_manifest.csv

      - name: Run complete test suite
        run: pytest

      - name: Run safety challenge preflight report
        run: python -m patient_journey_assistant.evaluate_safety

      - name: Detect whether the model provider secret is configured
        id: provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "A Gemini API key is configured; a small development sample will be scored."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Gemini API key is configured. Live answer scoring will be skipped; all offline checks still run."
          fi

      - name: Install full application dependencies for local-index and extractive evaluation
        run: python -m pip install -r requirements.txt

      - name: Fetch only approved sources and build the exact corpus
        run: |
          python -m patient_journey_assistant.ingest \
            --manifest data/source_manifest.csv \
            --output-dir data/local/processed \
            --fetch-approved \
            --delay-seconds 1
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          expected = {
              row["chunk_id"]
              for row in csv.DictReader(
                  Path("data/benchmark/chunk_inventory.csv").open(encoding="utf-8", newline="")
              )
          }
          records = [
              json.loads(line)
              for line in Path("data/local/processed/chunks.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          actual = {item["chunk_id"] for item in records}
          if len(expected) != 39 or actual != expected:
              raise SystemExit("The fetched source snapshot differs from the frozen 39-chunk inventory.")
          print("Approved source snapshot matches the frozen 39-chunk ID inventory.")
          PY

      - name: Build persistent local embedding index
        run: python -m patient_journey_assistant.build_index --chunks data/local/processed/chunks.jsonl --index-dir data/local/chroma

      - name: Evaluate extractive fallback against development benchmark
        run: python -m patient_journey_assistant.evaluate_extractive --split dev

      - name: Evaluate extractive fallback against held-out benchmark
        run: python -m patient_journey_assistant.evaluate_extractive --split heldout

      - name: Evaluate one development question per cell with the live model
        if: steps.provider.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m patient_journey_assistant.evaluate_answers --split dev --per-cell 1

      - name: Write extractive evaluation summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lines = [
              "# Extractive fallback evaluation",
              "",
              "> Deterministic verbatim-sentence fallback. Citation overlap is computed against assistant-adjudicated provisional labels, not independent human ground truth.",
              "",
              "| Split | Method | Questions | Answer rate | Gold-label citation precision (macro) | Gold-label citation recall (macro) | Citation coverage |",
              "|---|---|---:|---:|---:|---:|---:|",
          ]
          for split in ("dev", "heldout"):
              p = Path(f"data/local/evaluation/extractive_answers_{split}.json")
              report = json.loads(p.read_text(encoding="utf-8"))
              for method, label in (("baseline", "Baseline semantic"), ("contextual", "Condition + stage")):
                  m = report["results"]["method_summaries"][method]
                  lines.append(
                      f"| {split} | {label} | {m['question_count']} | "
                      f"{m['answer_rate']:.4f} | "
                      f"{m['citation_relevance_precision_macro']:.4f} | "
                      f"{m['citation_relevance_recall_macro']:.4f} | "
                      f"{m['labelled_relevant_citation_coverage']:.4f} |"
                  )
              delta = report["results"]["paired_differences_contextual_minus_baseline"]
              lines.extend([
                  "",
                  f"**{split} paired contextual − baseline:** citation precision "
                  f"{delta['citation_relevance_precision_macro_contextual_minus_baseline']:+.4f}; "
                  f"citation recall {delta['citation_relevance_recall_macro_contextual_minus_baseline']:+.4f}; "
                  f"citation coverage {delta['labelled_relevant_citation_coverage_contextual_minus_baseline']:+.4f}.",
                  "",
              ])
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload local evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-answer-quality-and-safety
          path: |
            data/local/evaluation/safety_preflight.json
            data/local/evaluation/extractive_answers_dev.json
            data/local/evaluation/extractive_answers_heldout.json
            data/local/evaluation/answer_quality_dev.json
            data/local/processed/ingestion_report.json
          if-no-files-found: warn
          retention-days: 30
